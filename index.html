all unmarked as present</button></p>${g||'<p style="color:var(--mu)">No one to list.</p>'}`}

function speakAttendanceGreeting(name,kind,gender){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const female=String(gender||'Male').toLowerCase()=='female',text=kind=='out'?(female?'Good Bye Mam':'Good Bye Sir'):(female?'Welcome Mam':'Welcome Sir');const say=()=>{const voices=window.speechSynthesis.getVoices(),v=voices.find(x=>/male|man|david|mark|daniel|alex|google uk english male/i.test(x.name+' '+x.voiceURI))||voices.find(x=>/^en/i.test(x.lang));const u=new SpeechSynthesisUtterance(text);u.voice=v||null;u.lang='en-US';u.rate=.9;u.pitch=.88;u.volume=1;window.speechSynthesis.speak(u)};if(window.speechSynthesis.getVoices().length)say();else window.speechSynthesis.onvoiceschanged=say}
function code(x){x=String(x).trim();const b=document.getElementById('lastscan'),now=Date.now();if(!x||(x==cam.last&&now-cam.lt<3000))return;cam.last=x;cam.lt=now;const p=allP().find(q=>(q.code.toLowerCase()==x.toLowerCase()||(q.alt||'').toLowerCase()==x.toLowerCase()));if(!p){if(b)b.innerHTML=`<p class="pill r">Code ${e(x)} is not registered</p>`;return}at.date=new Date().toISOString().slice(0,10);const d=A[at.date]=A[at.date]||{};if(p.k[0]=='B'){const r=d[p.k]=d[p.k]||{},key=at.staffAction=='out'?'checkOut':'checkIn';r[key]=tm();r.mode='Online';speakAttendanceGreeting(p.name,at.staffAction,p.gender);if(b)b.innerHTML=`<p class="pill s" style="display:block;border-radius:10px;padding:10px">${at.staffAction=='out'?'Checked out / left':'Checked in / arrived'}: <b>${e(p.name)}</b> (${e(p.sub)}) at ${e(r[key])}</p>`}else{const dup=d[p.k]&&d[p.k].st=='Present';if(!dup)d[p.k]={st:'Present',mode:'Online',time:tm()};if(b)b.innerHTML=`<p class="pill ${dup?'o':''}" style="display:block;border-radius:10px;padding:10px">${dup?'Already marked present at '+d[p.k].time+': ':'Marked present: '}<b>${e(p.name)}</b> (${e(p.sub)})</p>`}saveAttendance();lst();updateOnlineList()}
const msg=m=>{const c=document.getElementById('cmsg');if(c)c.textContent=m};
async function startCam(){stopCam();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('Camera not available here. Use the code box with a USB scanner.');
try{cam.s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(x){return msg('Camera blocked or not found. Use the code box with a USB scanner.')}
const v=document.getElementById('cv');if(!v){stopCam();return}v.srcObject=cam.s;try{await v.play()}catch(x){}msg('Hold a QR code or barcode in front of the camera');scan()}
function stopCam(){clearTimeout(cam.h);if(cam.s)cam.s.getTracks().forEach(x=>x.stop());cam.s=null}
function scan(){const v=document.getElementById('cv');if(!cam.s||!v)return;
if(v.readyState>=2){if(window.BarcodeDetector){cam.bd=cam.bd||new BarcodeDetector();cam.bd.detect(v).then(r=>r[0]&&code(r[0].rawValue)).catch(()=>{})}else if(window.jsQR){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0);const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(q)code(q.data)}}
cam.h=setTimeout(scan,350)}

function vch(id){const s=byId(id),yr=new Date().getFullYear(),sel=document.getElementById('fmonths');let ks=sel?[...sel.selectedOptions].map(x=>x.value):[];if(!ks.length)ks=MON.map((_,i)=>i).filter(i=>feeDue(s,i)>0);if(s.fee.annual&&(!s.fee.ann||((s.fee.ann.amt||0)+(s.fee.ann.discount||0)<s.fee.annual))&&![...ks].includes('A'))ks.push('A');if(regDue(s)&&![...ks].includes('R'))ks.push('R');if(!ks.length)return toast('Nothing due to generate a voucher for');const it=ks.sort((a,b)=>(a=='R'?101:a=='A'?100:+a)-(b=='R'?101:b=='A'?100:+b)).map(k=>k=='R'?['Registration',regDue(s),'r']:k=='A'?['Annual',Math.max(0,s.fee.annual-(s.fee.ann?(s.fee.ann.amt||0)+(s.fee.ann.discount||0):0)),'a']:[MON[k]+' '+yr,feeDue(s,+k),'t']);om(`<h3>Fee voucher</h3>${vH(s,it,'','','BFSC-'+String(++vc).padStart(6,'0'))}<button class="btn" onclick="print()">Print (3 copies on one page)</button> <button class="btn g" onclick="fv(${id})">Back</button>`)}

function ttSave(){const cls=document.getElementById('tte_class').value,sub=document.getElementById('tte_subject').value;if(!sub)return toast('Select a subject configured for this class');const old=ttFind(ttEditing.day,ttEditing.period);if(old)Object.assign(old,{cls:isNaN(cls)?cls:+cls,section:tte_section.value,subject:sub,teacher:tte_teacher.value,start:tte_start.value,end:tte_end.value,room:tte_room.value.trim(),period:ttEditing.period});else TT.push({id:Date.now(),day:ttEditing.day,period:ttEditing.period,cls:isNaN(cls)?cls:+cls,section:tte_section.value,subject:sub,teacher:tte_teacher.value,start:tte_start.value,end:tte_end.value,room:tte_room.value.trim()});cm();toast('Lecture saved');go('timetable')}

<script>
/* ===== Admin weekly class-wise timetable ===== */
P.clock='M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18M12 7v5l3 2';
const timetableMenu=NAV.find(n=>n[0]==='timetable');if(timetableMenu)timetableMenu[2]='clock';
const ADMIN_PERIODS=[1,2,3,4,5,6,7,8];
function weeklyTTFind(cls,period){return (typeof TT!=='undefined'?TT:[]).find(x=>x.day==='Weekly'&&String(x.cls)===String(cls)&&+x.period===+period)}
function weeklyAssignedSubjects(cls,current){const used=new Set((TT||[]).filter(x=>x.day==='Weekly'&&String(x.cls)===String(cls)&&+x.period!==+ttAdminEditing.period).map(x=>x.subject));return (C.find(c=>String(c.n)===String(cls))?.subjects||[]).filter(s=>!used.has(s)||s===current)}
function weeklyTeacherOptions(cls,subject,current){return T.filter(t=>{const a=t.subjectAssignments||{};return String(t.classes||'').includes(String(cls))||((a[String(cls)]||[]).includes(subject))}).map(t=>`<option value="${e(t.id)}" ${t.id===current?'selected':''}>${e(t.name)}</option>`).join('')}
let ttAdminEditing={cls:'',period:1};
function adminWeeklyCell(cls,period){const x=weeklyTTFind(cls,period),t=x&&T.find(q=>q.id===x.teacher);return `<td class="admin-tt-cell" onclick="ttAdminEdit('${e(cls)}',${period})">${x?`<b>${e(x.subject)}</b><br><small>${e(t?.name||'Teacher not assigned')}</small>`:'<span class="tt-empty">Set</span>'}</td>`}
function timeTableV(){return `<div class="card"><h3>Time Table</h3><p style="color:var(--mu)">Monday to Saturday use the same lecture assignments. Set each class subject once; after assignment it disappears from that class's subject list to prevent duplicate lectures. Friday only uses a different timing row.</p><div class="tb"><button class="btn" onclick="ttAdminEdit('${e(C[0]?.n||'')}',1)">${ic('plus')}Set lecture</button><button class="btn g" onclick="print()">Print timetable</button></div></div><div class="card"><div class="tb"><h3 style="margin:0">Class-wise weekly timetable</h3><span style="flex:1"></span><span class="pill">Monday–Saturday</span></div><div class="tbw"><table class="admin-weekly-grid"><tr><th>Class</th>${ADMIN_PERIODS.map(n=>`<th>Lecture ${n}</th>`).join('')}</tr><tr><th>Time</th>${TT_NORMAL_TIMES.map(x=>`<th>${x}</th>`).join('')}</tr><tr><th>Friday timing</th>${TT_FRIDAY_TIMES.map(x=>`<th>${x}</th>`).join('')}</tr>${C.map(c=>`<tr><th>Class ${e(c.n)}</th>${ADMIN_PERIODS.map(n=>adminWeeklyCell(c.n,n)).join('')}</tr>`).join('')||'<tr><td colspan="9">No classes available.</td></tr>'}</table></div></div>`}

  om(`<h3>${x.id?'Edit':'Set'} Class ${e(cls)} — Lecture ${period}</h3><p style="color:var(--mu)">This lecture applies from Monday to Saturday. Friday uses the separate timing shown in the timetable. Assigned subjects are removed from this class's available list.</p><div class="fm"><label>Class<select disabled><option>Class ${e(cls)}</option></select></label><label>Lecture number<select disabled><option>Lecture ${period}</option></select></label><label>Subject<select id="ttw_subject">${available.map(s=>`<option value="${e(s)}" ${s===x.subject?'selected':''}>${e(s)}</option>`).join('')||'<option value="">All class subjects already assigned</option>'}</select></label><label>Teacher<select id="ttw_teacher"><option value="">Not assigned</option>${teacherOpts}</select></label><label>Room / Period<input id="ttw_room" value="${e(x.room||'')}" placeholder="e.g. Room 1"></label></div><p><button class="btn" onclick="ttAdminSave()" ${available.length?'':'disabled'}>Save lecture</button>${x.id?'<button class="btn rd" onclick="ttAdminRemove()">Remove lecture</button>':''} <button class="btn g" onclick="cm()">Cancel</button></p>`);

function ttAdminSave(){const subject=document.getElementById('ttw_subject').value;if(!subject)return toast('All subjects for this class are already assigned');const old=weeklyTTFind(ttAdminEditing.cls,ttAdminEditing.period);if(old)Object.assign(old,{subject,teacher:ttw_teacher.value,room:ttw_room.value.trim()});else TT.push({id:Date.now(),day:'Weekly',period:ttAdminEditing.period,cls:isNaN(ttAdminEditing.cls)?ttAdminEditing.cls:+ttAdminEditing.cls,subject,teacher:ttw_teacher.value,room:ttw_room.value.trim()});cm();toast('Lecture assigned Monday to Saturday');go('timetable')}
function ttAdminRemove(){TT=TT.filter(x=>!(x.day==='Weekly'&&String(x.cls)===String(ttAdminEditing.cls)&&+x.period===+ttAdminEditing.period));cm();toast('Lecture removed');go('timetable')}

<script>
/* ===== Timetable break settings and teacher assignment fixes ===== */
let TT_BREAK_AFTER=0;
function ttMinutes(v){const p=String(v).trim().split(':').map(Number);return (p[0]||0)*60+(p[1]||0)}
function ttTimeLabel(m){return String(Math.floor(m/60)%24)+':'+String(m%60).padStart(2,'0')}
function ttAdjustedTimes(base,after){let shift=0;return base.map((label,i)=>{const p=label.replace('–','-').split('-').map(x=>x.trim()),a=ttMinutes(p[0])+shift,b=ttMinutes(p[1])+shift,out=ttTimeLabel(a)+'-'+ttTimeLabel(b);if(i+1===+after)shift+=30;return out})}
function ttDisplayNormalTimes(){return ttAdjustedTimes(TT_NORMAL_TIMES,TT_BREAK_AFTER)}
function ttDisplayFridayTimes(){return ttAdjustedTimes(TT_FRIDAY_TIMES,TT_BREAK_AFTER)}
function weeklyTeacherOptions(cls,subject,current){return T.map(t=>`<option value="${e(t.id)}" ${t.id===current?'selected':''}>${e(t.name)}</option>`).join('')}
function timeTableV(){const normal=ttDisplayNormalTimes(),fri=ttDisplayFridayTimes();return `<div class="card"><h3>Time Table</h3><p style="color:var(--mu)">Monday to Saturday use the same lecture assignments. A 30-minute break is inserted after the selected lecture and all following times adjust automatically.</p><div class="tb"><label>Break after lecture<select id="tt_break_after" onchange="TT_BREAK_AFTER=+this.value;go('timetable')"><option value="0" ${!TT_BREAK_AFTER?'selected':''}>No break</option>${ADMIN_PERIODS.slice(0,7).map(n=>`<option value="${n}" ${+TT_BREAK_AFTER===n?'selected':''}>After Lecture ${n}</option>`).join('')}</select></label><button class="btn" onclick="ttAdminEdit('${e(C[0]?.n||'')}',1)">${ic('plus')}Set lecture</button><button class="btn g" onclick="print()">Print timetable</button></div></div><div class="card"><div class="tb"><h3 style="margin:0">Class-wise weekly timetable</h3><span style="flex:1"></span><span class="pill">Monday–Saturday</span></div><div class="tbw"><table class="admin-weekly-grid"><tr><th>Class</th>${ADMIN_PERIODS.map(n=>`<th>Lecture ${n}</th>`).join('')}</tr><tr><th>Time</th>${normal.map(x=>`<th>${x}</th>`).join('')}</tr><tr><th>Friday timing</th>${fri.map(x=>`<th>${x}</th>`).join('')}</tr>${C.map(c=>`<tr><th>Class ${e(c.n)}</th>${ADMIN_PERIODS.map(n=>adminWeeklyCell(c.n,n)).join('')}</tr>`).join('')||'<tr><td colspan="9">No classes available.</td></tr>'}</table></div></div>`}
function ttAdminEdit(cls,period){ttAdminEditing={cls,period};const x=weeklyTTFind(cls,period)||{},available=weeklyAssignedSubjects(cls,x.subject||''),teacherOpts=weeklyTeacherOptions(cls,x.subject||'',x.teacher||'');om(`<h3>${x.id?'Edit':'Set'} Class ${e(cls)} — Lecture ${period}</h3><p style="color:var(--mu)">This lecture applies from Monday to Saturday. Friday uses the separate timing shown in the timetable.</p><div class="fm"><label>Class<select disabled><option>Class ${e(cls)}</option></select></label><label>Lecture number<select disabled><option>Lecture ${period}</option></select></label><label>Subject<select id="ttw_subject">${available.map(s=>`<option value="${e(s)}" ${s===x.subject?'selected':''}>${e(s)}</option>`).join('')||'<option value="">All class subjects already assigned</option>'}</select></label><label>Teacher<select id="ttw_teacher"><option value="">Not assigned</option>${teacherOpts}</select></label></div><p><button class="btn" onclick="ttAdminSave()" ${available.length?'':'disabled'}>Save lecture</button>${x.id?'<button class="btn rd" onclick="ttAdminRemove()">Remove lecture</button>':''} <button class="btn g" onclick="cm()">Cancel</button></p>`)}
function ttAdminSave(){const subject=document.getElementById('ttw_subject').value;if(!subject)return toast('All subjects for this class are already assigned');const old=weeklyTTFind(ttAdminEditing.cls,ttAdminEditing.period);if(old)Object.assign(old,{subject,teacher:ttw_teacher.value});else TT.push({id:Date.now(),day:'Weekly',period:ttAdminEditing.period,cls:isNaN(ttAdminEditing.cls)?ttAdminEditing.cls:+ttAdminEditing.cls,subject,teacher:ttw_teacher.value});cm();toast('Lecture assigned Monday to Saturday');go('timetable')}
function tLectures(){const t=tch,groups=teacherAssignedLectureGroups(t),scheduled=(typeof TT!=='undefined'?TT:[]).filter(x=>x.teacher===t.id).sort((a,b)=>String(a.day).localeCompare(String(b.day))||+a.period-+b.period),normal=ttDisplayNormalTimes(),friday=ttDisplayFridayTimes(),nums=[1,2,3,4,5,6,7,8],timingRow=(label,items,head=false)=>`<tr><th>${label}</th>${items.map(x=>`<${head?'th':'td'}>${x}</${head?'th':'td'}>`).join('')}</tr>`;return `<div class="card"><h3>My Lectures</h3><p style="color:var(--mu)">Your lecture numbers and timings.</p></div><div class="card"><h3>Lecture Timings</h3><div class="tbw"><table class="teacher-timing-grid"><tbody>${timingRow('Lecture No.',nums,true)}${timingRow('Time',normal)}${timingRow('Friday timing',friday)}</tbody></table></div></div><div class="card"><h3>Assigned Subjects by Class</h3>${groups.length?`<div class="tbw"><table><tr><th>Class</th><th>Subjects assigned to me</th></tr>${groups.map(x=>`<tr><td><b>Class ${e(x.cls)}</b></td><td>${x.subjects.map(s=>`<span class="pill" style="display:inline-block;margin:2px 4px 2px 0">${e(s)}</span>`).join('')}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--mu)">No subjects have been assigned to you yet.</p>'}</div><div class="card"><h3>My Scheduled Lectures</h3>${scheduled.length?`<div class="tbw"><table><tr><th>Day</th><th>Lecture No.</th><th>Time</th><th>Class</th><th>Subject</th></tr>${scheduled.map(x=>`<tr><td>${e(x.day==='Weekly'?'Monday–Saturday':x.day)}</td><td>${e(x.period||'-')}</td><td>${e((x.day==='Friday'?friday:normal)[(+x.period||1)-1]||'-')}</td><td>Class ${e(x.cls)}</td><td>${e(x.subject)}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--mu)">No timetable lectures have been scheduled for you yet.</p>'}</div>`}
nav();
</script>
<script>
/* ===== Visible breaks and adjustable period timings ===== */
let TT_CUSTOM_NORMAL_TIMES=['08:00–08:30','08:30–09:00','09:00–09:30','09:30–10:00','10:00–10:30','10:30–11:00','11:00–11:30','11:30–12:00'];
let TT_CUSTOM_FRIDAY_TIMES=['08:00–08:25','08:25–08:50','08:50–09:15','09:15–09:40','09:40–10:05','10:05–10:30','10:30–10:55','10:55–11:20'];
function ttDisplayNormalTimes(){return ttAdjustedTimes(TT_CUSTOM_NORMAL_TIMES,TT_BREAK_AFTER)}
function ttDisplayFridayTimes(){return ttAdjustedTimes(TT_CUSTOM_FRIDAY_TIMES,TT_BREAK_AFTER)}
function ttTimeInputValue(label,part){const p=String(label).replace('–','-').split('-');return (p[part]||'').trim()}
function ttBreakRow(){return `<tr class="tt-break-row"><th>Break</th>${ADMIN_PERIODS.map(n=>n===+TT_BREAK_AFTER?`<td colspan="1"><b>BREAK</b><br><small>30 minutes</small></td>`:'<td></td>').join('')}</tr>`}

function toggleMenu(menu){openMenus[menu]=!openMenus[menu];Object.keys(openMenus).filter(k=>k!==menu).forEach(k=>openMenus[k]=false);nav()}
function menuGroup(key,label,icon,items){const open=!!openMenus[key],active=cur===key||items.some(x=>cur===x[0]);return `<div class="nav-group ${active?'active':''}"><button class="nv nav-group-head ${active?'on':''}" onclick="toggleMenu('${key}')">${ic(icon)}<span>${label}</span><b class="nav-chevron ${open?'open':''}">⌄</b></button>${open?`<div class="nav-submenu">${items.map(x=>`<button class="nv nav-sub ${cur===x[0]?'on':''}" onclick="goSub('${x[0]}','${x[1]}','${key}')">${x[1]}</button>`).join('')}</div>`:''}</div>`}
function nav(){const base=NAV.filter(n=>!['exam','results','rep','set'].includes(n[0]));const settings=NAV.find(n=>n[0]==='set');side.innerHTML=`<div class="brand"><div class="logo">${ic('cap')}</div><div><b>Bright Future</b><small>School Management System</small></div></div>`+base.map(n=>`<button class="nv ${cur==n[0]?'on':''}" onclick="go('${n[0]}')">${ic(n[2])}${n[1]}</button>`).join('')+menuGroup('exam','Examinations','file',EXAM_SUBMENUS)+menuGroup('rep','Reports','bars',REPORT_SUBMENUS)+(settings?`<button class="nv ${cur==='set'?'on':''}" onclick="go('set')">${ic(settings[2])}${settings[1]}</button>`:'')+'<div class="tag">Better Education<br>Brighter Future</div>'}
function goSub(key,title,parent){stopCam();cur=key;openMenus[parent]=true;side.classList.remove('open');nav();document.getElementById('view').innerHTML=`<div class="card submenu-page"><div class="tb"><div><h2 style="margin:0">${title}</h2><small style="color:var(--mu)">${parent==='exam'?'Examinations':'Reports'}</small></div><span style="flex:1"></span><button class="btn" onclick="toggleMenu('${parent}')">Back to menu</button></div><div class="submenu-placeholder"><div class="submenu-placeholder-icon">${ic(parent==='exam'?'file':'bars')}</div><h3>${title}</h3><p>Use this section to manage ${title.toLowerCase()}.</p></div></div>`;anim();scrollTo(0,0)}
document.head.insertAdjacentHTML('beforeend',`<style>
.nav-group{margin:0;padding:0}.nav-group-head{width:100%;display:flex!important;align-items:center;gap:10px;text-align:left}.nav-group-head span{flex:1}.nav-chevron{font-size:18px;font-weight:700;line-height:1;transition:transform .2s}.nav-chevron.open{transform:rotate(180deg)}.nav-submenu{display:grid;gap:2px;margin:0 0 4px;padding:2px 8px 2px 26px;border-left:1px solid rgba(255,255,255,.18)}.nv.nav-sub{min-height:32px!important;padding:7px 10px!important;border-radius:7px!important;font-size:11px!important;color:rgba(255,255,255,.78)!important;white-space:normal!important;line-height:1.15!important;text-align:left!important}.nv.nav-sub:hover,.nv.nav-sub.on{background:rgba(255,255,255,.16)!important;color:#fff!important}.submenu-placeholder{min-height:260px;display:grid;place-items:center;text-align:center;align-content:center;gap:8px;color:var(--mu)}.submenu-placeholder-icon{width:54px;height:54px;border-radius:16px;background:color-mix(in srgb,var(--ac) 14%,transparent);display:grid;place-items:center;color:var(--ac)}.submenu-placeholder-icon .i{width:28px;height:28px}
</style>`);
nav();
</script>
<script>
/* ===== Functional Examination and Reports modules ===== */
const ACADEMIC_KEY='bright_future_academic_modules_v1';
let AC={types:[{id:'annual',name:'Annual Examination',term:'Annual',status:'Active'},{id:'mid',name:'Mid Term Examination',term:'Mid Term',status:'Active'}],groups:[],schedule:[],marks:[],grades:[{name:'A+',min:90,max:100},{name:'A',min:80,max:89},{name:'B',min:70,max:79},{name:'C',min:60,max:69},{name:'D',min:50,max:59},{name:'F',min:0,max:49}],published:[]};
const AC_DEFAULT=JSON.stringify(AC);
try{const z=JSON.parse(localStorage.getItem(ACADEMIC_KEY)||'null');if(z)AC=Object.assign(AC,z)}catch(e){}
const acSave=()=>{try{localStorage.setItem(ACADEMIC_KEY,JSON.stringify(AC))}catch(e){}};
const acId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const acExam=(id)=>AC.types.find(x=>x.id===id)||(id?{id,name:'(Deleted exam)'}:(AC.types[0]||{id:'',name:'Exam'}));
const acSid=s=>s.id||s.roll;
const acActiveExams=()=>{const a=AC.types.filter(x=>x.status!=='Inactive');return (a.length?a:AC.types).map(x=>[x.id,x.name])};
const acClassOpts=(all)=>[...(all?[['','All classes']]:[]),...acClasses().map(x=>[x,x])];
const acInClass=(s,cls)=>{if(!cls)return true;if(!s)return false;const u=sectionUnits().find(x=>x.label===cls);return !!u&&sectionStudentMatch(s,u.key)};
const acStudentOpts=(cls)=>acStudents().filter(s=>acInClass(s,cls)).map(x=>[acSid(x),`${x.name} · ${sectionLabel(x.cls,x.sec)} · ${x.roll}`]);
function acFillStudents(selId,clsId){const el=document.getElementById(selId),c=document.getElementById(clsId);if(!el)return;el.innerHTML=acStudentOpts(c?c.value:'').map(x=>`<option value="${e(String(x[0]))}">${e(String(x[1]))}</option>`).join('')||'<option value="">No students</option>'}
function acPositions(rows){let p=0;return rows.map((x,i)=>{if(i===0||Math.abs(x.pct-rows[i-1].pct)>1e-9)p=i+1;return {...x,pos:p}})}
const acResHead=['Student','Class','Subjects','Total','Percentage','Grade'];
const acResTR=rows=>rows.map(x=>`<tr><td>${e(x.st?.name||x.st?.roll||'Unknown')}</td><td>${e(x.st?sectionLabel(x.st.cls,x.st.sec):'')}</td><td>${x.subjects}</td><td>${x.total}/${x.max}</td><td>${x.pct.toFixed(1)}%</td><td><b>${x.grade}</b></td></tr>`);
const acRankHead=['Position','Student','Class','Total','Percentage','Grade'];
const acRankTR=rows=>acPositions(rows).map(x=>`<tr><td>${x.pos}</td><td>${e(x.st?.name||'')}</td><td>${e(x.st?sectionLabel(x.st.cls,x.st.sec):'')}</td><td>${x.total}/${x.max}</td><td>${x.pct.toFixed(1)}%</td><td><b>${x.grade}</b></td></tr>`);
/* link admin exam types to the teacher-portal exams (Annual / Mid Term / Monthly / Weekly) so both sides share one set of marks */
const acLegacyKey=t=>{if(!t)return null;const n=String(t.name||'').toLowerCase(),tr=String(t.term||'').trim().toLowerCase();return EXAMS.find(x=>x.toLowerCase()===tr)||EXAMS.find(x=>n.startsWith(x.toLowerCase()))||null};
const acTypeFor=key=>AC.types.find(t=>acLegacyKey(t)===key&&t.status!=='Inactive')||AC.types.find(t=>acLegacyKey(t)===key);
function acPushLegacy(m){const t=AC.types.find(x=>x.id===m.examId),key=acLegacyKey(t),st=acStudents().find(s=>String(acSid(s))===String(m.studentId)),ix=SUB.indexOf(m.subject);if(!key||!st||ix<0||!(m.max>0))return;const v=Math.round(m.obtained/m.max*100);st.examMarks=st.examMarks||{};if(!st.examMarks[key])st.examMarks[key]=(key==='Annual'&&Array.isArray(st.marks))?st.marks:SUB.map(()=>null);st.examMarks[key][ix]=v;if(key==='Annual')st.marks=st.examMarks[key];m.lv=v}
function acClearLegacy(m){const t=AC.types.find(x=>x.id===m.examId),key=acLegacyKey(t),st=acStudents().find(s=>String(acSid(s))===String(m.studentId)),ix=SUB.indexOf(m.subject);if(!key||!st||ix<0)return;const arr=resultMarks(st,key);if(Array.isArray(arr))arr[ix]=null}
function acStoreMark(ex,sid,sub,max,obt){let m=AC.marks.find(x=>x.examId===ex&&String(x.studentId)===String(sid)&&x.subject===sub);if(m){m.max=max;m.obtained=obt;delete m.demo;delete m.src}else{m={id:acId(),examId:ex,studentId:sid,subject:sub,max,obtained:obt};AC.marks.push(m)}acPushLegacy(m)}
const acStudents=()=>Array.isArray(S)?S.slice().sort((a,b)=>{const ca=Number(String(a.cls||'').replace(/[^0-9.]/g,''))||999999,cb=Number(String(b.cls||'').replace(/[^0-9.]/g,''))||999999;return ca-cb||String(a.name||'').localeCompare(String(b.name||''))}):[];
const acClasses=()=>sectionUnits().slice().sort((a,b)=>Number(String(a.n).replace(/[^0-9.]/g,''))-Number(String(b.n).replace(/[^0-9.]/g,''))||String(a.sec).localeCompare(String(b.sec))).map(x=>String(x.label));
const acSubjects=()=>[...new Set((Array.isArray(SUB)?SUB:[]).concat((Array.isArray(C)?C.flatMap(x=>x.subjects||[]):[])))];
function acGrade(mark,max){const pct=max?mark/max*100:0;return AC.grades.slice().sort((a,b)=>b.min-a.min).find(x=>pct>=+x.min)?.name||'F'}
function acField(label,id,type='text',value='',extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${e(String(value??''))}" ${extra}></label>`}
function acSelect(label,id,options,value='',extra=''){return `<label>${label}<select id="${id}" ${extra}>${options.map(x=>`<option value="${e(String(x[0]))}" ${String(x[0])===String(value)?'selected':''}>${e(String(x[1]))}</option>`).join('')}</select></label>`}
function acTable(headers,rows,empty='No records yet.'){return `<div class="tbw"><table class="ac-table"><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" style="text-align:center;color:var(--mu)">${empty}</td></tr>`}</table></div>`}
function acShell(title,desc,body){return `<div class="card ac-module"><div class="tb"><div><h2 style="margin:0">${title}</h2><small style="color:var(--mu)">${desc}</small></div><span style="flex:1"></span><button class="btn g" onclick="acRefresh()">Refresh</button><button class="btn" onclick="acPrintModule()">Print</button></div>${body}</div>`}
function acPrintModule(){document.body.classList.add('printing-ac-module');window.print();setTimeout(()=>document.body.classList.remove('printing-ac-module'),800)}
function acRefresh(){const key=cur,title=[...EXAM_SUBMENUS,...REPORT_SUBMENUS].find(x=>x[0]===key)?.[1]||'Module',parent=EXAM_SUBMENUS.some(x=>x[0]===key)?'exam':'rep';goSub(key,title,parent)}
function acTypesV(){const rows=AC.types.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.term)}</td><td><span class="pill ${x.status==='Inactive'?'r':''}">${e(x.status)}</span></td><td><button class="btn g" onclick="acToggleType('${x.id}')">${x.status==='Inactive'?'Activate':'Deactivate'}</button> <button class="btn d" onclick="acAskDeleteType('${x.id}')">Delete</button></td></tr>`);return acShell('Exam Types','Create and manage examination types. Use the terms Annual, Mid Term, Monthly or Weekly to share marks with the teacher portal.',`<div class="fm ac-form">${acField('Exam name','ac_type_name')} ${acField('Term / session','ac_type_term')} ${acSelect('Status','ac_type_status',[['Active','Active'],['Inactive','Inactive']])}<button class="btn" onclick="acAddType()">Add exam type</button></div>${acTable(['Exam type','Term','Status','Action'],rows)}`)}
function acToggleType(id){const t=AC.types.find(x=>x.id===id);if(!t)return;t.status=t.status==='Inactive'?'Active':'Inactive';acSave();acRefresh()}
function acAskDeleteType(id){cfm('Delete this exam together with its marks and schedule?',"cm();acDelete('types','"+id+"')")}
function acAddType(){const name=ac_type_name.value.trim();if(!name)return toast('Enter an exam name');if(AC.types.some(x=>x.name.toLowerCase()===name.toLowerCase()))return toast('An exam with this name already exists');AC.types.push({id:acId(),name,term:ac_type_term.value.trim()||'—',status:ac_type_status.value});acSave();acRefresh()}
function acScheduleV(){const exams=acActiveExams(),classes=acClasses().map(x=>[x,x]),subs=(()=>{const o=acSchSubjectOpts(exams[0]?.[0],classes[0]?.[0]);return o.length?o:[['','All subjects already scheduled']]})(),rows=AC.schedule.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.start).localeCompare(String(b.start))).map(x=>`<tr><td>${e(acExam(x.examId).name)}</td><td>${e(x.cls)}</td><td>${e(x.subject)}</td><td>${e(x.date)}</td><td>${e(x.start)}–${e(x.end)}</td><td><button class="btn d" onclick="acDelete('schedule','${x.id}')">Delete</button></td></tr>`);return acShell('Exam Schedule','Plan examination dates and subject timings.',`<div class="fm ac-form">${acSelect('Exam','ac_sc_exam',exams,'','onchange="acSchRefreshSubjects()"')} ${acSelect('Class','ac_sc_class',classes,'','onchange="acSchRefreshSubjects()"')} ${acSelect('Subject','ac_sc_subject',subs)} ${acField('Date','ac_sc_date','date')} ${acField('Start time','ac_sc_start','time')} ${acField('End time','ac_sc_end','time')}<button class="btn" onclick="acAddSchedule()">Add to schedule</button></div>${acTable(['Exam','Class','Subject','Date','Time','Action'],rows)}`)}
function acSchSubjectOpts(ex,cl){const used=new Set(AC.schedule.filter(x=>x.examId===ex&&x.cls===cl).map(x=>x.subject));return acSubjects().filter(s=>!used.has(s)).map(s=>[s,s])}
function acSchRefreshSubjects(){const g=i=>document.getElementById(i),el=g('ac_sc_subject');if(!el)return;const o=acSchSubjectOpts(g('ac_sc_exam').value,g('ac_sc_class').value);el.innerHTML=o.length?o.map(x=>`<option value="${e(x[0])}">${e(x[1])}</option>`).join(''):'<option value="">All subjects already scheduled</option>'}
function acAddSchedule(){const g=i=>document.getElementById(i).value,ex=g('ac_sc_exam'),cl=g('ac_sc_class'),sub=g('ac_sc_subject'),date=g('ac_sc_date'),s=g('ac_sc_start'),en=g('ac_sc_end');if(!ex||!sub)return toast('Select an exam and subject');if(!date)return toast('Choose the exam date');if(!s||!en)return toast('Enter the start and end time');if(en<=s)return toast('End time must be after the start time');if(AC.schedule.some(x=>x.examId===ex&&x.cls===cl&&x.subject===sub))return toast(sub+' is already scheduled for Class '+cl+' in this exam');const clash=AC.schedule.find(x=>x.cls===cl&&x.date===date&&x.start&&x.end&&x.start<en&&s<x.end);if(clash)return toast('Clash: '+clash.subject+' is already set for this class at '+clash.start+'–'+clash.end);AC.schedule.push({id:acId(),examId:ex,cls:cl,subject:sub,date,start:s,end:en});acSave();acRefresh()}
function acGroupsV(){const rows=AC.groups.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.examIds.map(acExam).map(y=>y.name).join(', ')||'All exams')}</td><td><button class="btn d" onclick="acDelete('groups','${x.id}')">Delete</button></td></tr>`),checks=AC.types.map(x=>`<label class="ac-check"><input type="checkbox" name="ac_group_exam" value="${x.id}"> ${e(x.name)}</label>`).join('');return acShell('Exam Groups','Group examinations for a common result cycle.',`<div class="fm ac-form">${acField('Group name','ac_group_name')}<div class="ac-checks">${checks||'Add an exam type first.'}</div><button class="btn" onclick="acAddGroup()">Create group</button></div>${acTable(['Group','Included examinations','Action'],rows)}`)}
function acAddGroup(){const name=ac_group_name.value.trim();if(!name)return toast('Enter a group name');AC.groups.push({id:acId(),name,examIds:[...document.querySelectorAll('[name=ac_group_exam]:checked')].map(x=>x.value)});acSave();acRefresh()}
function acMarksTable(){const gv=i=>(document.getElementById(i)||{}).value||'',ex=gv('ac_mf_exam'),cl=gv('ac_mf_class'),map=new Map(acStudents().map(s=>[String(acSid(s)),s])),list=AC.marks.filter(x=>(!ex||x.examId===ex)&&(!cl||acInClass(map.get(String(x.studentId)),cl))).slice().reverse(),rows=list.map(x=>{const st=map.get(String(x.studentId));return `<tr><td>${e(acExam(x.examId).name)}</td><td>${e(st?.name||x.studentId)}</td><td>${e(st?sectionLabel(st.cls,st.sec):'—')}</td><td>${e(x.subject)}</td><td>${x.obtained}/${x.max}</td><td><b>${e(acGrade(x.obtained,x.max))}</b></td><td><button class="btn d" onclick="acDelete('marks','${x.id}')">Delete</button></td></tr>`});return `<small style="color:var(--mu)">${list.length} record${list.length===1?'':'s'}</small>`+acTable(['Exam','Student','Class','Subject','Marks','Grade','Action'],rows)}
function acMarksFilter(){const t=document.getElementById('ac-marks-table');if(t)t.innerHTML=acMarksTable()}
function acMarksV(){const subs=acSubjects().map(x=>[x,x]);return acShell('Marks Entry','Enter marks for one student, or for a whole class at once.',`<div class="fm ac-form">${acSelect('Exam','ac_m_exam',acActiveExams())} ${acSelect('Class','ac_m_class',acClassOpts(true),'','onchange="acFillStudents(\'ac_m_student\',\'ac_m_class\')"')} ${acSelect('Student','ac_m_student',acStudentOpts(''))} ${acSelect('Subject','ac_m_subject',subs)} ${acField('Maximum marks','ac_m_max','number','100','min="1"')} ${acField('Obtained marks','ac_m_obtained','number','','min="0" step="any"')}<button class="btn" onclick="acAddMark()">Save marks</button></div><h4>Class-wise bulk entry</h4><div class="fm ac-form">${acSelect('Exam','ac_b_exam',acActiveExams())} ${acSelect('Class','ac_b_class',acClassOpts(false))} ${acSelect('Subject','ac_b_subject',subs)} ${acField('Maximum marks','ac_b_max','number','100','min="1"')}<button class="btn" onclick="acBulkLoad()">Load students</button></div><div id="ac-bulk"></div><h4>Saved marks</h4><div class="fm ac-form">${acSelect('Exam','ac_mf_exam',[['','All exams'],...AC.types.map(x=>[x.id,x.name])],'','onchange="acMarksFilter()"')} ${acSelect('Class','ac_mf_class',acClassOpts(true),'','onchange="acMarksFilter()"')}</div><div id="ac-marks-table">${acMarksTable()}</div>`)}
function acBulkLoad(){const g=i=>document.getElementById(i).value,ex=g('ac_b_exam'),cl=g('ac_b_class'),sub=g('ac_b_subject'),max=+g('ac_b_max'),box=document.getElementById('ac-bulk');if(!ex||!cl||!sub)return toast('Select exam, class and subject');if(!(max>0))return toast('Maximum marks must be greater than 0');const list=acStudents().filter(s=>acInClass(s,cl));if(!list.length){box.innerHTML='<p style="color:var(--mu)">No students in this class.</p>';return}const old=new Map(AC.marks.filter(x=>x.examId===ex&&x.subject===sub).map(x=>[String(x.studentId),x]));window.acBulkCtx={ex,sub,max};box.innerHTML=`<div class="tbw"><table class="ac-table"><tr><th>Roll</th><th>Student</th><th>Obtained (out of ${max})</th></tr>${list.map(s=>{const m=old.get(String(acSid(s))),same=m&&+m.max===max;return `<tr><td>${e(s.roll)}</td><td>${e(s.name)}</td><td><input class="acb" data-sid="${e(String(acSid(s)))}" type="number" min="0" max="${max}" step="any" value="${same?m.obtained:''}" placeholder="${m&&!same?m.obtained+'/'+m.max:''}" style="width:120px"></td></tr>`}).join('')}</table></div><p style="color:var(--mu)">Leave a box empty to skip that student. Existing marks are updated.</p><p><button class="btn" onclick="acBulkSave()">Save all marks</button></p>`}
function acBulkSave(){const c=window.acBulkCtx;if(!c)return toast('Load the students first');const ins=[...document.querySelectorAll('#ac-bulk .acb')].filter(i=>i.value.trim()!=='');if(!ins.length)return toast('Enter at least one mark');if(ins.some(i=>isNaN(+i.value)||+i.value<0||+i.value>c.max))return toast('Marks must be between 0 and '+c.max);ins.forEach(i=>acStoreMark(c.ex,i.dataset.sid,c.sub,c.max,+i.value));acSave();acMarksFilter();toast(ins.length+' marks saved')}
function acAddMark(){const g=i=>document.getElementById(i),ex=g('ac_m_exam').value,sid=g('ac_m_student').value,sub=g('ac_m_subject').value,max=+g('ac_m_max').value,raw=g('ac_m_obtained').value.trim(),obt=+raw;if(!ex||!sid||!sub)return toast('Select exam, student and subject');if(!(max>0))return toast('Maximum marks must be greater than 0');if(raw===''||isNaN(obt)||obt<0||obt>max)return toast('Obtained marks must be between 0 and '+max);acStoreMark(ex,sid,sub,max,obt);acSave();acRefresh()}
function acGradesV(){const rows=AC.grades.slice().sort((a,b)=>b.min-a.min).map(x=>`<tr><td>${e(x.name)}</td><td>${x.min}%</td><td>${x.max}%</td><td><button class="btn d" onclick="acDelete('grades','${x.name}')">Delete</button></td></tr>`);return acShell('Grade System','Define grade bands used in marks and results.',`<div class="fm ac-form">${acField('Grade name','ac_grade_name')} ${acField('Minimum %','ac_grade_min','number','0','min="0" max="100"')} ${acField('Maximum %','ac_grade_max','number','100','min="0" max="100"')}<button class="btn" onclick="acAddGrade()">Add grade</button></div>${acTable(['Grade','Minimum','Maximum','Action'],rows)}`)}
function acAddGrade(){const name=ac_grade_name.value.trim(),min=+ac_grade_min.value,max=+ac_grade_max.value;if(!name||ac_grade_min.value===''||ac_grade_max.value===''||min<0||max<min||max>100)return toast('Enter a valid grade range');if(AC.grades.some(x=>String(x.name).toLowerCase()===name.toLowerCase()))return toast('Grade '+name+' already exists');const o=AC.grades.find(x=>min<=+x.max&&+x.min<=max);if(o)return toast('This range overlaps grade '+o.name+' ('+o.min+'–'+o.max+'%)');AC.grades.push({name,min,max});acSave();acRefresh()}
function acResultRows(examId,cls){const map=new Map(acStudents().map(s=>[String(acSid(s)),s])),grouped={};AC.marks.filter(x=>!examId||x.examId===examId).forEach(x=>{const st=map.get(String(x.studentId));if(!st||!acInClass(st,cls))return;const k=String(x.studentId);grouped[k]??={st,total:0,max:0,subjects:0};grouped[k].total+=+x.obtained;grouped[k].max+=+x.max;grouped[k].subjects++});return Object.values(grouped).map(x=>({...x,pct:x.max?x.total/x.max*100:0,grade:acGrade(x.total,x.max)})).sort((a,b)=>b.pct-a.pct)}
function acResultsV(){const exams=AC.types.map(x=>[x.id,x.name]),classes=acClasses().map(x=>[x,x]);return acShell('Results','View calculated examination results.',`<div class="fm ac-form">${acSelect('Exam','ac_r_exam',exams)} ${acSelect('Class','ac_r_class',[['','All classes'],...classes])}<button class="btn" onclick="acShowResults()">View results</button></div><div id="ac-result-table">${acTable(acResHead,acResTR(acResultRows(AC.types[0]?.id||'','')),'Enter marks to calculate results.')}</div>`)}
function acShowResults(){document.getElementById('ac-result-table').innerHTML=acTable(acResHead,acResTR(acResultRows(ac_r_exam.value,ac_r_class.value)),'No marks found for this selection.')}

<script>
/* ===== Browser auto-save: keeps all school data in this browser and restores it on reload ===== */
(function(){
  const KEY='bright_future_autosave_v1',PKEY='bright_future_autosave_photos_v1';
  let last='',lastP='',warned=false,off=false;
  const arr=v=>Array.isArray(v)?v:[];
  function build(){
    const ph={};
    const strip=(list,p)=>list.map(o=>{if(o&&o.photo){ph[p+o.id]=o.photo;const c={...o};delete c.photo;return c}return o});
    const data={v:1,savedAt:new Date().toISOString(),S:strip(S,'s'),T:strip(T,'t'),C:C,X:X,SUB:SUB,
      CFG:{name:CFG.name,sess:CFG.sess,addr:CFG.addr,ah:CFG.ah},act:st.act,nid:nid,vc:vc,A:A,AC:AC};
    return {main:JSON.stringify(data),photos:JSON.stringify(ph)};
  }
  function warn(){if(warned)return;warned=true;try{toast('Auto-save paused: browser storage is full. Download a backup from Settings.')}catch(_){}}
  function save(){
    if(off)return;
    try{
      const b=build();
      if(b.main!==last){localStorage.setItem(KEY,b.main);last=b.main}
      if(b.photos!==lastP){localStorage.setItem(PKEY,b.photos);lastP=b.photos}
      warned=false;
    }catch(e){warn()}
  }
  function restore(){
    let raw=null;
    try{raw=localStorage.getItem(KEY)}catch(_){return}
    if(!raw)return;
    try{
      const d=JSON.parse(raw);let ph={};
      try{ph=JSON.parse(localStorage.getItem(PKEY)||'{}')||{}}catch(_){}
      if(Array.isArray(d.S)){
        S.splice(0,S.length,...d.S.filter(s=>s&&typeof s==='object'));
        S.forEach(s=>{
          s.fee=s.fee||{monthly:0,annual:0,credit:0,total:0,paid:0,rec:{},ann:null};
          s.fee.rec=s.fee.rec||{};if(s.remarks==null)s.remarks='';if(s.fee.discount==null)s.fee.discount=0;
          if(ph['s'+s.id])s.photo=ph['s'+s.id];
        });
      }
      if(Array.isArray(d.T)){
        T.splice(0,T.length,...d.T.filter(t=>t&&typeof t==='object').map(t=>({pays:[],classes:[],active:true,...t})));
        T.forEach(t=>{if(ph['t'+t.id])t.photo=ph['t'+t.id]});
      }
      if(arr(d.C).length)C.splice(0,C.length,...d.C);
      if(Array.isArray(d.X))X.splice(0,X.length,...d.X);
      if(arr(d.SUB).length)SUB.splice(0,SUB.length,...d.SUB);
      if(Array.isArray(d.act))st.act.splice(0,st.act.length,...d.act);
      if(d.CFG){
        if(d.CFG.name)CFG.name=d.CFG.name;if(d.CFG.sess)CFG.sess=d.CFG.sess;if(d.CFG.addr!=null)CFG.addr=d.CFG.addr;
        document.title=CFG.name+' School Management System';
        if(d.CFG.ah){const ah=d.CFG.ah;let n=0;const iv=setInterval(()=>{if(CFG.ah){CFG.ah=ah;clearInterval(iv)}else if(++n>100)clearInterval(iv)},20)}
      }
      nid=Math.max(+d.nid||0,S.reduce((m,s)=>Math.max(m,(+s.id||0)+1),0));
      if(+d.vc>vc)vc=+d.vc;
      if(d.A&&typeof d.A==='object'){Object.keys(A).forEach(k=>delete A[k]);Object.assign(A,d.A)}
      if(d.AC&&typeof d.AC==='object')AC=Object.assign(JSON.parse(AC_DEFAULT),d.AC);
      try{if(typeof sortClasses==='function')sortClasses()}catch(_){}
      last=raw;lastP=localStorage.getItem(PKEY)||'';
      try{nav();go(cur)}catch(_){}
    }catch(err){
      try{localStorage.setItem(KEY+'_unreadable',raw)}catch(_){}
      console.error('Auto-save restore failed',err);
    }
  }
  restore();
  /* Reset must also clear the auto-saved copy, and stop it being written again before the reload */
  const _resetDo=resetDo;
  resetDo=function(){
    const ok=((document.getElementById('rs_c')||{}).value||'').trim().toUpperCase()==='RESET';
    if(ok){off=true;try{localStorage.removeItem(KEY);localStorage.removeItem(PKEY)}catch(_){}}
    return _resetDo.apply(this,arguments);
  };
  setInterval(save,2000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  window.addEventListener('pagehide',save);
  window.addEventListener('beforeunload',save);
})();

</script>

<div class="rcd-two"><div class="rcd-sum"><h3>Result Summary</h3><table><tr><td>Total Marks</td><td>${mx}</td></tr><tr><td>Obtained Marks</td><td>${tot}</td></tr><tr><td>Percentage</td><td>${mx?Math.round(pct)+'%':'—'}</td></tr><tr><td>Grade</td><td class="rcd-grade">${mx?e(acGrade(tot,mx)):'—'}</td></tr>${pos?`<tr><td>Position in class</td><td>${pos.pos} of ${peers.length}</td></tr>`:''}</table></div><div class="rcd-rem"><h3>Remarks</h3><div class="rcd-rb" contenteditable="true">${mx?e(remark(pct)):''}</div><div class="rcd-ct"><small>Class Teacher</small><i>${teacher?e(teacher.name):''}</i></div></div></div>
<div class="rcd-sign"><div><span>Principal</span></div><div class="rcd-seal">${ADM_LOGO?`<img src="${ADM_LOGO}" alt="">`:`<b>${e(CFG.name)}</b>`}</div><div><span>Exam Controller</span></div></div>
<div class="rcd-foot">${e(tag||CFG.name)}</div></div>`;
}
window.reportCardHTML=reportCardHTML;
acCardsV=function(){const exams=AC.types.map(x=>[x.id,x.name]);return acShell('Report Cards','Generate a report card for one student, or for every student of a class.',`<div class="fm ac-form">${acSelect('Exam','ac_card_exam',exams)} ${acSelect('Class','ac_card_class',acClassOpts(true),'','onchange="acFillStudents(\'ac_card_student\',\'ac_card_class\')"')} ${acSelect('Student','ac_card_student',acStudentOpts(''))}<button class="btn" onclick="acPreviewCard()">Preview report card</button><button class="btn g" onclick="acPreviewCard();acPrintModule()">Print</button></div><div id="ac-card-preview"></div>`)};
AC_PAGES.reportCards=acCardsV;
acPreviewCard=function(){
  const ex=ac_card_exam.value,sid=ac_card_student.value,cl=ac_card_class.value,box=document.getElementById('ac-card-preview');
  let l=[];if(sid){const st=acStudents().find(s=>String(acSid(s))===String(sid));if(st)l=[st]}else if(cl)l=acStudents().filter(s=>acInClass(s,cl));
  if(!l.length)return toast('Select a student, or a class to generate all its report cards');
  box.innerHTML=l.map(s=>reportCardHTML(s,ex)).join('');
};
