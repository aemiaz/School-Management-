function lk(m){return `<div class="card"><h3>${m=='fees'?'Fee Management':'Check Results'}</h3>${m=='fees'?'<p><button class="btn g" onclick="fl(-1)">Unpaid fee list by class</button> <button class="btn" onclick="genFee()">Generate fee for next month</button> <small style="color:var(--mu)">Generated up to '+MON[gm]+'</small></p>':''}<div class="tb"><input id="lq" placeholder="Search by student name or roll number" oninput="lr('${m}')"></div><div id="lres" class="pick"></div><div id="ld"></div></div>`}

function lr(m){const r=find(lq.value);lres.innerHTML=r.slice(0,6).map(s=>`<button onclick="pk('${m}',${s.id})"><span>${e(s.name)}</span><span style="color:var(--mu)">${s.roll} / Class ${s.cls}</span></button>`).join('')||(lq.value?'<p style="color:var(--mu)">No student found.</p>':'');ld.innerHTML=''}
function pk(m,id){lres.innerHTML='';ld.innerHTML=m=='fees'?feeV(byId(id),1):repV(byId(id))}
function feeV(s,h){const f=s.fee,d=f.total-f.paid,yr=new Date().getFullYear(),row=(lab,amt,r,v,od)=>`<tr><td>${r?'':`<input class="mk" type="checkbox" value="${v}" onchange="ptot()" aria-label="Select ${lab}">`}</td><td>${lab}</td><td>${fm(r?r.amt:amt)}</td><td><span class="pill ${r?'':od?'r':'o'}">${r?'Paid':od?'Overdue':'Upcoming'}</span></td><td>${r?r.method:'-'}</td><td>${r?r.date:'-'}</td><td>${r&&r.ref?e(r.ref):'-'}</td></tr>`;
return `${h?`<h3 style="margin-top:14px">${e(s.name)} <small style="color:var(--mu)">${e(s.roll)}, Class ${e(s.cls)}-${e(s.sec)}</small></h3>`:''}<div class="kv"><div><small>Monthly fee</small><b>${fm(f.monthly)}</b></div><div><small>Annual charges</small><b>${fm(f.annual)}</b></div><div><small>Paid</small><b>${fm(f.paid)}</b></div><div><small>Due</small><b>${fm(d)}</b></div><div><small>Advance credit</small><b>${fm(f.credit)}</b></div></div><p><button class="btn g" onclick="feeStmt(${s.id})">Preview / print all fee details</button> <button class="btn g" onclick="vch(${s.id})">Generate voucher (3 copies)</button></p>${d?`<div class="tb"><select id="pm" aria-label="Payment method">${METH.map(m=>`<option>${m}</option>`).join('')}</select><input id="pr" placeholder="Transaction / reference no. (optional)"><button class="btn g" onclick="selOv()">Select overdue</button></div>`:'<span class="pill">Fully paid for the year</span>'}<div class="tbw"><table><tr><th></th><th>Fee</th><th>Amount</th><th>Status</th><th>Method</th><th>Paid on</th><th>Reference</th></tr>${MON.map((m,i)=>row(m+' '+yr,f.monthly,f.rec[i],i,i<=gm)).join('')}${f.annual?row('Annual charges',f.annual,f.ann,'A',true):''}</table></div>${d?`<div class="tb" style="margin-top:12px"><button class="btn s" onclick="pay(${s.id})">Pay selected</button><b id="pt"></b></div><h4>Advance / installment credit</h4><div class="tb"><input id="cra" type="number" min="1" placeholder="Amount received (Rs.)"><select id="crm" aria-label="Credit payment method">${METH.map(m=>`<option>${m}</option>`).join('')}</select><input id="crr" placeholder="Reference (optional)"><button class="btn" onclick="addCr(${s.id})">Add to credit</button></div><small style="color:var(--mu)">Credit pays each month's fee automatically as fees are generated, until it is used up.</small>`:''}`}

function repV(s){if(!s.marks)return '<p style="color:var(--mu)">No results published for this student yet.</p>';const t=mv(s).reduce((a,b)=>a+b,0),p=pc(s);return `<div class="rc"><h4>REPORT CARD - Bright Future School</h4><div class="kv"><div><small>Student</small><b>${e(s.name)}</b></div><div><small>Father</small><b>${e(s.father)}</b></div><div><small>Roll No</small><b>${s.roll}</b></div><div><small>Class</small><b>${s.cls}-${s.sec}</b></div></div><div class="tbw"><table style="min-width:420px"><tr><th>Sr.</th><th>Subject</th><th>Max</th><th>Obtained</th><th>%</th><th>Grade</th></tr>${SUB.map((n,i)=>`<tr><td>${i+1}</td><td>${n}</td><td>100</td><td>${s.marks[i]??'-'}</td><td>${s.marks[i]==null?'-':s.marks[i]+'%'}</td><td>${s.marks[i]==null?'-':gr(s.marks[i])}</td></tr>`).join('')}</table></div><div class="kv"><div><small>Total</small><b>${t} / ${mv(s).length*100}</b></div><div><small>Percentage</small><b>${p}%</b></div><div><small>Grade</small><b>${gr(p)}</b></div><div><small>Position</small><b>${rs(s)}</b></div></div><button class="btn g" onclick="print()">Print</button></div>`}
function pay(id){const s=byId(id),ks=[...document.querySelectorAll('.mk:checked')].map(x=>x.value).sort((a,b)=>a=='A'?1:b=='A'?-1:a-b);if(!ks.length)return toast('Select at least one item to pay');

function applyCredit(s){const f=s.fee,dt=new Date().toISOString().slice(0,10);let n=0;for(let i=0;i<=gm&&f.credit>=f.monthly;i++)if(!f.rec[i]){f.rec[i]={amt:f.monthly,method:'Credit',date:dt,ref:'Auto-paid from advance credit',vno:'AUTO'};f.credit-=f.monthly;n++}sync(s);return n}

om(`<h3>Credit added</h3><div class="vc"><p><b>BRIGHT FUTURE SCHOOL &amp; COLLEGE</b> - Advance payment receipt<br>Student: <b>${e(s.name)}</b> | Class ${e(s.cls)}-${e(s.sec)} | Roll No ${e(s.roll)}</p><p>Amount received: <b>${fm(a)}</b> by ${m}${r?' (Ref: '+e(r)+')':''}<br>Months paid from credit now: <b>${n}</b><br>Credit balance: <b>${fm(s.fee.credit)}</b></p><p>Remaining credit pays each month's fee automatically when fees are generated.</p></div><button class="btn" onclick="print()">Print receipt</button> <button class="btn g" onclick="cm();go(cur)">Done</button>`)}

function prof(id){const s=byId(id),k=(a,b)=>`<div><small>${a}</small><b>${e(b||'-')}</b></div>`;om(`<h3>${e(s.name)}</h3><h4>Student's Personal Information</h4><div class="kv">${k('Full name & surname',s.name)}${k('Date of birth',s.dob)}${k('Gender',s.gender)}${k('Place of birth',s.pob)}${k('Nationality',s.nat)}${k('Religion',s.rel)}${k('B-Form / CRC number',s.cnic)}</div><h4>Parent / Guardian Information</h4><div class="kv">${k("Father's name",s.father)}${k("Father's CNIC",s.fcnic)}${k('Occupation & designation',s.focc)}${k("Mother's name",s.mother)}${k("Mother's CNIC",s.mcnic)}${k('Primary mobile',s.phone)}${k('Emergency contact',s.emerg)}${k('Email',s.email)}${k('Residential address',addr(s))}${k('Permanent address',s.paddr||'Same as residential')}</div><h4>Academic & Admission Details</h4><div class="kv">${k('Class',s.cls)}${k('Section',s.sec)}${k('Roll no',s.roll)}${k('Admission date',s.admDate)}${k('Unique ID',s.uid||'Not generated')}${k('Session',s.sess)}${k('Monthly fee',fm(s.fee.monthly))}${k('Annual charges',fm(s.fee.annual))}${k('Advance credit',fm(s.fee.credit))}${k('Previous school',s.prev)}${k('Last class passed',s.lastCls)}${k('Last result',(s.lastRes+' '+s.lastPct).trim())}${k('Promotion history',(s.hist||[]).map(h=>h.sess+': '+h.status).join('; '))}${s.board&&s.board!='None'?k('Board',s.board)+k('Board reg. / roll no',s.brno):''}</div><p><button class="btn g" onclick="stf(${id})">Edit / Delete</button> ${s.uid?`<button class="btn g" onclick="qr('s${id}')">ID card &amp; QR</button>`:`<button class="btn g" onclick="cm();gi.tab='s';gi.cls='${s.cls}';go('ids')">Generate ID</button>`} <a class="btn s" target="_blank" rel="noopener" href="https://wa.me/${dg(s.phone).replace(/^0/,'92')}">WhatsApp parent</a></p><h4>Fees &amp; Dues</h4>${feeV(s)}<h4>Results</h4>${repV(s)}`)}

const g=(at.tab=='s'?C.map(c=>['Class '+c.n,l.filter(p=>p.cls==c.n)]):[['Staff',l]]).map(([h,r])=>r.length?`<details open><summary style="cursor:pointer;font-weight:700;padding:10px 0">${e(h)} <span class="pill">${r.length}</span></summary>${r.map(row).join('')}</details>`:'').join('');
return `<div class="kv"><div><small>Present</small><b>${n('Present')}</b></div><div><small>Absent</small><b>${n('Absent')}</b></div><div><small>Leave</small><b>${n('Leave')}</b></div><div><small>Not marked</small><b>${l.length-n('Present')-n('Absent')-n('Leave')}</b></div></div><p><button class="btn g" onclick="mkAll()">Mark all unmarked as present</button></p>${g||'<p style="color:var(--mu)">No one to list.</p>'}`}
function mk(k,x){const d=A[at.date]=A[at.date]||{};if(d[k]&&d[k].st==x)delete d[k];else d[k]={st:x,mode:'Offline',time:tm()};lst()}
function mkAll(){const d=A[at.date]=A[at.date]||{};people().forEach(p=>{if(!d[p.k])d[p.k]={st:'Present',mode:'Offline',time:tm()}});lst()}
function code(x){x=String(x).trim();const b=document.getElementById('lastscan'),now=Date.now();if(!x||(x==cam.last&&now-cam.lt<3000))return;cam.last=x;cam.lt=now;
const p=allP().find(q=>(q.code.toLowerCase()==x.toLowerCase()||(q.alt||'').toLowerCase()==x.toLowerCase()));if(!p){if(b)b.innerHTML=`<p class="pill r">Code ${e(x)} is not registered</p>`;return}
at.date=new Date().toISOString().slice(0,10);const d=A[at.date]=A[at.date]||{};const dup=d[p.k]&&d[p.k].st=='Present';if(!dup)d[p.k]={st:'Present',mode:'Online',time:tm()};
if(b)b.innerHTML=`<p class="pill ${dup?'o':''}" style="display:block;border-radius:10px;padding:10px">${dup?'Already marked present at '+d[p.k].time+': ':'Marked present: '}<b>${e(p.name)}</b> (${e(p.sub)})</p>`;lst()}
const msg=m=>{const c=document.getElementById('cmsg');if(c)c.textContent=m};
async function startCam(){stopCam();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('Camera not available here. Use the code box with a USB scanner.');
try{cam.s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(x){return msg('Camera blocked or not found. Use the code box with a USB scanner.')}
const v=document.getElementById('cv');if(!v){stopCam();return}v.srcObject=cam.s;try{await v.play()}catch(x){}msg('Hold a QR code or barcode in front of the camera');scan()}
function stopCam(){clearTimeout(cam.h);if(cam.s)cam.s.getTracks().forEach(x=>x.stop());cam.s=null}
function scan(){const v=document.getElementById('cv');if(!cam.s||!v)return;
if(v.readyState>=2){if(window.BarcodeDetector){cam.bd=cam.bd||new BarcodeDetector();cam.bd.detect(v).then(r=>r[0]&&code(r[0].rawValue)).catch(()=>{})}else if(window.jsQR){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0);const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(q)code(q.data)}}
cam.h=setTimeout(scan,350)}

const iso=()=>new Date().toISOString().slice(0,10),nuid=()=>'BFS-'+(Math.max(1000,...S.map(s=>parseInt(dg(s.uid||''))||0))+1);
function vH(s,it,mode,ref,no){const tu=it.filter(x=>x[2]=='t'),tA=tu.reduce((a,x)=>a+x[1],0),aA=it.filter(x=>x[2]=='a').reduce((a,x)=>a+x[1],0),tot=tA+aA,onl=mode&&mode!='Cash',v=n=>n?n:'-';
const rows=[['Tuition Fee'+(tu.length?' ('+tu.map(x=>x[0]).join(', ')+')':''),tA],['Transport Fee',0],['Library Fee',0],['Activity Fee',0],['Annual Charges (if applicable)',aA]];
return ['Student Copy','Office Copy','Bank Copy'].map(c=>`<div class="fv"><div class="fh"><svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#1c2b4a" stroke-width="1.6"><path d="M2 5c3-1 7-1 10 1 3-2 7-2 10-1v14c-3-1-7-1-10 1-3-2-7-2-10-1z M12 6v14"/></svg><div><b class="sn">BRIGHT FUTURE</b><br>SCHOOL &amp; COLLEGE</div><div class="cp">${c}</div></div><div class="ft">FEE VOUCHER (SESSION ${e(s.sess||'')})</div>
<div class="fg"><span>Voucher No: <u>${no}</u></span><span>Date: <u>${new Date().toLocaleDateString('en-GB')}</u></span><span>Student Name: <u>${e(s.name)}</u></span><span>Class: <u>${e(s.cls)}-${e(s.sec)}</u></span><span>Roll No: <u>${e(s.roll)}</u></span><span>Admission No: <u>ADM-${dg(s.uid||s.roll)}</u></span><span>Term: <u>${tu.length?tu.map(x=>x[0]).join(', '):'Annual'}</u></span></div>
<table><tr><th>S.No.</th><th>Description</th><th>Amount (Rs.)</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}.</td><td>${r[0]}</td><td>${v(r[1])}</td></tr>`).join('')}<tr><td colspan="2" style="text-align:right"><b>TOTAL AMOUNT DUE</b></td><td><b>${tot}</b></td></tr></table>
<div style="margin-top:5px"><b>PAYMENT MODE:</b> ${mode=='Cash'?'[x]':'[ ]'} Cash / [ ] Cheque / ${onl?'[x]':'[ ]'} Online Transfer${onl?' ('+e(mode)+')':''}</div><div><b>CHEQUE / TRANSACTION ID:</b> ${ref?e(ref):'______________________'} &nbsp; <b>DRAWN ON BANK:</b> ______________</div><div><b>AMOUNT IN WORDS:</b> ${tot?words(tot):'______________________'}</div>
<div class="fs"><div><b>ISSUED BY:</b><br>Accounts Department</div><div style="text-align:right"><b>AUTHORIZED SIGNATORY</b><br>(School Seal)</div></div></div>`).join('')}
function vch(id){const s=byId(id),yr=new Date().getFullYear();let ks=[...document.querySelectorAll('.mk:checked')].map(x=>x.value);if(!ks.length)ks=[...document.querySelectorAll('.mk')].map(x=>x.value).filter(x=>x=='A'||+x<=gm);if(!ks.length)return toast('Nothing due to generate a voucher for');
const it=ks.sort((a,b)=>a=='A'?1:b=='A'?-1:a-b).map(k=>k=='A'?['Annual',s.fee.annual,'a']:[MON[k]+' '+yr,s.fee.monthly,'t']);om(`<h3>Fee voucher</h3>${vH(s,it,'','','BFSC-'+String(++vc).padStart(6,'0'))}<button class="btn" onclick="print()">Print (3 copies on one page)</button> <button class="btn g" onclick="fv(${id})">Back</button>`)}
/* teachers */
const tb=id=>T.find(x=>x.id==id);let prm=new Date().getMonth(),slipN=0;
function teachersV(){return `<div class="card"><h3>Teachers</h3><div class="tb"><button class="btn" onclick="tf('-1')">${ic('plus')}Add Teacher</button><button class="btn s" onclick="payroll()">Generate pay for all teachers</button></div>${T.map(x=>`<div class="sr"><div><b style="cursor:pointer" onclick="tp('${x.id}')">${e(x.name)}</b><br><small style="color:var(--mu)">${tid(x)} / ${e(x.subject)} / Classes: ${x.classes.length?x.classes.map(c=>e(c)).join(', '):'None'} / ${fm(x.pay)} per month</small></div><div class="sa"><button class="btn g" onclick="tp('${x.id}')">Profile</button><button class="btn g" onclick="tcl('${x.id}')">Assigned classes</button><button class="btn s" onclick="tpay('${x.id}')">Generate pay</button><button class="btn g" onclick="tf('${x.id}')">Edit</button><button class="btn g" onclick="tdel('${x.id}')">Delete</button></div></div>`).join('')||'<p style="color:var(--mu)">No teachers yet.</p>'}</div>`}
function tf(id){const x=tb(id)||{name:'',subject:'',phone:'',qual:'',joined:iso(),pay:''},f=(i,l,v,ty)=>`<label>${l}<input id="t_${i}" type="${ty||'text'}" value="${e(v)}"></label>`;
om(`<h3>${id=='-1'?'Add Teacher':'Edit Teacher'}</h3><div class="fm">${f('n','Full name',x.name)}${f('s','Subject',x.subject)}${f('q','Qualification',x.qual)}${f('p','Mobile (03XX-XXXXXXX)',x.phone,'tel')}${f('j','Joining date',x.joined,'date')}${f('m','Monthly pay (Rs.)',x.pay,'number')}</div><p><button class="btn" onclick="tS('${id}')">Save teacher</button></p>`)}
function tS(id){const v=i=>document.getElementById('t_'+i).value.trim(),n=v('n'),pay=+v('m');if(!n||!v('s'))return toast('Enter the name and subject');if(!(pay>0))return toast('Enter the monthly pay');if(!/^03\d{9}$/.test(dg(v('p'))))return toast('Mobile must look like 03XX-XXXXXXX');
const d={name:n,subject:v('s'),qual:v('q'),phone:v('p'),joined:v('j'),pay};if(id=='-1')T.push({id:'BFT-'+String(Math.max(0,...T.map(x=>parseInt(dg(x.id))||0))+1).padStart(3,'0'),classes:[],pays:[],...d});else Object.assign(tb(id),d);cm();toast('Teacher saved');go(cur)}
function tdel(id){cfm('Delete teacher '+e(tb(id).name)+'?',"tdelY('"+id+"')")}
function tdelY(id){T.splice(T.indexOf(tb(id)),1);cm();toast('Teacher deleted');go(cur)}
function tcl(id){const x=tb(id);om(`<h3>Assigned classes - ${e(x.name)}</h3><p style="color:var(--mu)">${e(x.subject)} teacher. Tick every class this teacher teaches.</p>${C.map(c=>`<label class="sr" style="cursor:pointer"><span><input class="tk" type="checkbox" value="${e(c.n)}" ${x.classes.some(y=>y==c.n)?'checked':''}> Class ${e(c.n)} <small style="color:var(--mu)">(${S.filter(s=>s.cls==c.n).length} students)</small></span></label>`).join('')||'<p>No classes yet.</p>'}<p><button class="btn" onclick="tclS('${id}')">Save assigned classes</button></p>`)}
function tclS(id){const on=[...document.querySelectorAll('.tk:checked')].map(c=>c.value);tb(id).classes=C.filter(c=>on.includes(String(c.n))).map(c=>c.n);cm();toast('Assigned classes saved');go(cur)}
function tp(id){const x=tb(id),k=(a,b)=>`<div><small>${a}</small><b>${e(b||'-')}</b></div>`;om(`<h3>${e(x.name)}</h3><div class="kv">${k('Unique ID',tid(x))}${k('Subject',x.subject)}${k('Qualification',x.qual)}${k('Mobile',x.phone)}${k('Joining date',x.joined)}${k('Monthly pay',fm(x.pay))}${k('Assigned classes',x.classes.map(c=>'Class '+c).join(', ')||'None')}</div><p><button class="btn g" onclick="tf('${id}')">Edit</button> <button class="btn g" onclick="tcl('${id}')">Assigned classes</button> ${x.uid?`<button class="btn g" onclick="qr('${id}')">ID card &amp; QR</button>`:`<button class="btn g" onclick="cm();gi.tab='t';go('ids')">Generate ID</button>`} <button class="btn s" onclick="tpay('${id}')">Generate pay</button></p><h4>Pay history</h4><div class="tbw"><table><tr><th>Month</th><th>Net pay</th><th>Method</th><th>Paid on</th><th>Slip</th></tr>${x.pays.map((r,i)=>`<tr><td>${MON[r.m]} ${r.y}</td><td>${fm(r.net)}</td><td>${r.method}</td><td>${r.date}</td><td><button class="btn g" onclick="slip('${id}',${i})">View</button></td></tr>`).join('')||'<tr><td colspan="5">No salary paid yet.</td></tr>'}</table></div>`)}
function payroll(){om(`<h3>Generate pay for all teachers</h3><div class="tb"><select id="rm" aria-label="Month" onchange="prm=+this.value;prl()">${MON.map((m,i)=>`<option value="${i}" ${i==prm?'selected':''}>${m} ${new Date().getFullYear()}</option>`).join('')}</select></div><div id="rl">${prh()}</div>`)}
const prl=()=>document.getElementById('rl').innerHTML=prh(),yrN=()=>new Date().getFullYear();
function prh(){const pd=x=>x.pays.findIndex(r=>r.m==prm&&r.y==yrN()),tot=T.reduce((a,x)=>a+x.pay,0),paid=T.reduce((a,x)=>a+(pd(x)>=0?x.pays[pd(x)].net:0),0);
return `<div class="kv"><div><small>Total monthly payroll</small><b>${fm(tot)}</b></div><div><small>Paid for ${MON[prm]}</small><b>${fm(paid)}</b></div></div>`+T.map(x=>{const i=pd(x);return `<div class="sr"><div><b>${e(x.name)}</b><br><small style="color:var(--mu)">${tid(x)} / ${e(x.subject)} / ${fm(x.pay)}</small></div><div class="sa"><span class="pill ${i>=0?'':'r'}">${i>=0?'Paid':'Unpaid'}</span>${i>=0?`<button class="btn g" onclick="slip('${x.id}',${i})">Slip</button>`:`<button class="btn s" onclick="tpay('${x.id}',${prm})">Pay</button>`}</div></div>`}).join('')||'<p>No teachers.</p>'}
function tpay(id,m){const x=tb(id),mo=m==null?new Date().getMonth():m;om(`<h3>Pay ${e(x.name)}</h3><div class="kv"><div><small>Monthly pay</small><b>${fm(x.pay)}</b></div><div><small>Teacher ID</small><b>${tid(x)}</b></div></div><div class="fm"><label>Month<select id="y_m">${MON.map((n,i)=>`<option value="${i}" ${i==mo?'selected':''}>${n} ${yrN()}</option>`).join('')}</select></label><label>Payment date<input id="y_d" type="date" value="${iso()}"></label><label>Allowance / bonus (Rs.)<input id="y_b" type="number" min="0" value="0"></label><label>Deductions (Rs.)<input id="y_x" type="number" min="0" value="0"></label><label>Payment method<select id="y_t">${METH.map(m=>`<option>${m}</option>`).join('')}</select></label><label>Reference (optional)<input id="y_r"></label></div><p><button class="btn s" onclick="tsub('${id}')">Submit and pay</button></p>`)}
function tsub(id){const x=tb(id),g=i=>document.getElementById('y_'+i).value,m=+g('m'),b=+g('b')||0,d=+g('x')||0;if(x.pays.some(r=>r.m==m&&r.y==yrN()))return toast('Salary for '+MON[m]+' is already paid');if(b<0||d<0||d>x.pay+b)return toast('Check the allowance and deduction amounts');
const r={m,y:yrN(),basic:x.pay,bonus:b,ded:d,net:x.pay+b-d,method:g('t'),ref:g('r').trim(),date:g('d')||iso(),vno:'SAL-'+String(++slipN).padStart(5,'0')};x.pays.push(r);st.act.unshift(['wallet','Salary paid',fm(r.net)+' ('+r.method+') - '+x.name,tm()]);toast('Salary paid: '+fm(r.net));slip(id,x.pays.length-1)}
function slip(id,i){const x=tb(id),r=x.pays[i];om(`<div class="vc" style="padding:14px"><div style="text-align:center"><b style="font-size:16px">BRIGHT FUTURE SCHOOL &amp; COLLEGE</b><br>SALARY SLIP - ${MON[r.m]} ${r.y}</div><p>Teacher: <b>${e(x.name)}</b> | ID: ${tid(x)} | Subject: ${e(x.subject)}<br>Slip No: ${r.vno} | Paid on: ${r.date} | Method: ${r.method}${r.ref?' | Ref: '+e(r.ref):''}</p><table><tr><th>Description</th><th>Amount (Rs.)</th></tr><tr><td>Basic monthly pay</td><td>${r.basic}</td></tr><tr><td>Allowance / bonus</td><td>${r.bonus}</td></tr><tr><td>Deductions</td><td>-${r.ded}</td></tr><tr><td><b>Net pay</b></td><td><b>${r.net}</b></td></tr></table><p>In words: ${words(r.net)}</p><p>Accounts Department &nbsp;&nbsp;&nbsp; Teacher signature: __________</p></div><button class="btn" onclick="print()">Print slip</button> <button class="btn g" onclick="payroll()">Back to payroll</button> <button class="btn g" onclick="cm();go(cur)">Done</button>`)}
function qr(k){const p=allP().find(q=>q.k==k);om(`<div style="text-align:center"><h3>${e(p.name)}</h3><p>${e(p.sub)}</p><div id="qrb" style="display:inline-block;padding:10px;background:#fff"></div><p>Unique ID: <b>${e(p.code)}</b></p><p style="color:var(--mu)">Scan this QR code on the Attendance page to mark present.</p><button class="btn" onclick="print()">Print ID card</button></div>`);if(window.QRCode)new QRCode(document.getElementById('qrb'),{text:p.code,width:200,height:200})}
function idAll(){cards(people())}

const tid=x=>x.uid||'Not generated';
function cards(l){om(`<h3>ID cards and QR codes (${l.length})</h3><div class="idg">${l.map((p,i)=>`<div class="idc"><b>BRIGHT FUTURE</b><br>${e(p.name)}<br><span>${e(p.sub)}</span><div id="q_${i}"></div><b>${e(p.code)}</b></div>`).join('')}</div><p><button class="btn" onclick="print()">Print all</button></p>`);if(window.QRCode)l.forEach((p,i)=>new QRCode(document.getElementById('q_'+i),{text:p.code,width:100,height:100}))}
let gi={tab:'s',cls:'',q:'',f:''};const gst=x=>x.uid?`<span class="pill">${e(x.uid)}</span>`:'<span class="pill r">Not generated</span>';
function gitems(){const q=gi.q.toLowerCase();return gi.tab=='s'?S.filter(s=>(!gi.cls||s.cls==gi.cls)&&(!q||s.name.toLowerCase().includes(q)||s.roll.toLowerCase().includes(q))&&(!gi.f||(gi.f=='n')==!s.uid)):T.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!gi.f||(gi.f=='n')==!x.uid))}
const glh=()=>{const l=gitems();return `<p style="color:var(--mu)">${l.length} shown</p>`+(l.map(x=>`<label class="sr" style="cursor:pointer"><span><input class="gk" type="checkbox" value="${x.id}"> <b>${e(x.name)}</b> <small style="color:var(--mu)">${gi.tab=='s'?e(x.roll)+' / Class '+e(x.cls)+'-'+e(x.sec):e(x.subject)}</small></span>${gst(x)}</label>`).join('')||'<p>No matching records.</p>')},gl=()=>document.getElementById('gl').innerHTML=glh(),selAll=v=>document.querySelectorAll('.gk').forEach(c=>c.checked=v);
function gidV(){if(gi.tab=='s'&&!gi.cls&&C.length)gi.cls=C[0].n;return `<div class="card"><h3>Generate IDs</h3><div class="tb"><button class="btn ${gi.tab=='s'?'':'g'}" onclick="gi.tab='s';go('ids')">Students</button><button class="btn ${gi.tab=='t'?'':'g'}" onclick="gi.tab='t';go('ids')">Staff</button>${gi.tab=='s'?`<select onchange="gi.cls=this.value;gl()" aria-label="Class">${C.map(c=>`<option ${c.n==gi.cls?'selected':''}>${e(c.n)}</option>`).join('')}</select>`:''}<select onchange="gi.f=this.value;gl()" aria-label="Status"><option value="" ${!gi.f?'selected':''}>All</option><option value="n" ${gi.f=='n'?'selected':''}>Not generated</option><option value="g" ${gi.f=='g'?'selected':''}>Generated</option></select><input placeholder="Search name${gi.tab=='s'?' or roll no':''}" value="${e(gi.q)}" oninput="gi.q=this.value;gl()"></div><div class="tb"><button class="btn s" onclick="genIds(1)">${gi.tab=='s'?'Generate for whole class':'Generate for all staff'}</button><button class="btn" onclick="genIds()">Generate for selected</button><button class="btn g" onclick="selAll(true)">Select all</button><button class="btn g" onclick="selAll(false)">Clear</button><button class="btn g" onclick="gcards()">View / print cards</button></div><div id="gl">${glh()}</div></div>`}
function gtg(all){const pool=gi.tab=='s'?S.filter(s=>!gi.cls||s.cls==gi.cls):T,sel=[...document.querySelectorAll('.gk:checked')].map(x=>x.value);return all?pool:pool.filter(x=>sel.includes(String(x.id)))}
const citems=tg=>tg.map(x=>gi.tab=='s'?{name:x.name,sub:'Class '+x.cls+'-'+x.sec+' / Roll '+x.roll,code:x.uid}:{name:x.name,sub:x.subject+' Teacher',code:x.uid});
function genIds(all){const tg=gtg(all);if(!tg.length)return toast('Tick at least one record first');const nw=tg.filter(x=>!x.uid);nw.forEach(x=>x.uid=gi.tab=='s'?nuid():x.id);if(nw.length)st.act.unshift(['plus','IDs generated',nw.length+(gi.tab=='s'?' student':' staff')+' IDs',tm()]);
toast(nw.length+' new IDs generated'+(tg.length>nw.length?' ('+(tg.length-nw.length)+' already had IDs)':''));const c=citems(tg);gl();cards(c)}
function gcards(){const tg=gtg().filter(x=>x.uid);if(!tg.length)return toast('Tick students or staff that already have IDs');cards(citems(tg))}
S.forEach(applyCredit);
nav();go('dash');
</script></body></html>
